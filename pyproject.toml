[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentsense"
version = "0.0.1"
description = "Open testbed for per-die power and temperature sensing in 2.5D/3D chip stacks"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["opentsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # gates/*/runs hold downloaded copies of tests/ (Kaggle bundles)
