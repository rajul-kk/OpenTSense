# G93 S3 logic die: an H100-class accelerator (GH100). Die area from NVIDIA; the block arrangement follows package
# photos (HBM stacks on the two long sides); strip widths, the band position and all densities are assumptions to
# sweep. Compute density is set from our routed TPU tile (G100 W1, 2.07 W/mm2 at 800 ps); total_W then rescales every
# block by one factor.
# Square die of 28500 um side = 812.25 mm2: NVIDIA's 814 mm2 snapped by -0.2% so the die lies on the 0.5 mm cell grid
# G93's S3 stack shares with the 11 mm HBM footprint. HBM PHY strips 1500 um on left and right; NVLink/PCIe PHY
# strips 1000 um on top and bottom between them; L2 band 2000 um high across the middle; compute in the two halves
# (1000 + 12250 + 2000 + 12250 + 1000 = 28500 um).
name: gh100_class
size_um: [28500, 28500]
total_W: 700                    # H100 SXM5 TDP: press figures; NVIDIA's table not yet read verbatim (secondary)
background_W_mm2: 0.0
sources:
  nvidia_blog: "NVIDIA Technical Blog, NVIDIA Hopper Architecture In-Depth (22 Mar 2022): full GH100 'a die size of 814 mm2', 80 billion transistors, TSMC 4N; 6 HBM3 stacks (5 active on H100 SXM5), 60 MB L2 (50 MB on SXM5)"
  press_h100: "700 W H100 SXM5 TDP and an L2 in two partitions (TechPowerUp, AnandTech, Chips and Cheese, ServeTheHome)"
  photos: "H100 SXM5 package photos: HBM stacks along the two long sides of the die (secondary)"
  g100_tpu: "OpenTSense G100 record tpu-800 maps.npz, window W1: 2.07 W/mm2 (our own routed real-activity tile)"
  assumed: "stated in this file, to sweep in G93"
blocks:
  - {name: hbm_phy_left, rect_um: [0, 0, 1500, 28500], W_mm2: 1.0, kind: phy, source: photos, grade: secondary}
  - {name: hbm_phy_right, rect_um: [27000, 0, 1500, 28500], W_mm2: 1.0, kind: phy, source: photos, grade: secondary}
  - {name: io_phy_bottom, rect_um: [1500, 0, 25500, 1000], W_mm2: 0.8, kind: phy, source: assumed, grade: assumption}
  - {name: io_phy_top, rect_um: [1500, 27500, 25500, 1000], W_mm2: 0.8, kind: phy, source: assumed, grade: assumption}
  - {name: compute_south, rect_um: [1500, 1000, 25500, 12250], W_mm2: 2.07, kind: compute, source: g100_tpu, grade: assumption}
  - {name: l2, rect_um: [1500, 13250, 25500, 2000], W_mm2: 0.3, kind: sram, source: press_h100, grade: assumption}
  - {name: compute_north, rect_um: [1500, 15250, 25500, 12250], W_mm2: 2.07, kind: compute, source: g100_tpu, grade: assumption}
