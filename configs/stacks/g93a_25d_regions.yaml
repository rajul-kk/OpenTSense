# G93a (c)1: G71's 2.5D stack without the monolithic-silicon approximation. The chiplet layer is underfill
# (Thermo's underfill value, k = 0.7 W/m K) with silicon regions at the two chiplet footprints of G71's maps.
name: g93a_25d_regions
size_um: [4400, 3000]
grid: [88, 60]
ambient_K: 300
heat_sink: {htc: 5.0e4}
materials:
  silicon: {k: 130, cv: 1.63566e6}
  tim: {k: 4.0, cv: 2.0e6}
  copper: {k: 400, cv: 3.45e6}
  bond: {k: 1.5, cv: 2.0e6}
  underfill: {k: 0.7, cv: 1.8e6}
layers:
  - {name: spreader, material: copper, thickness_um: 500, n_sub: 10}
  - {name: tim, material: tim, thickness_um: 25, n_sub: 3}
  - {name: chiplets, die: true, material: underfill, thickness_um: 50, source_um: 2, n_sub: 6,
     regions: [{material: silicon, rect_um: [100, 500, 2000, 2000]}, {material: silicon, rect_um: [2300, 500, 2000, 2000]}]}
  - {name: ubump, material: bond, thickness_um: 20, n_sub: 3}
  - {name: interposer, material: silicon, thickness_um: 100, n_sub: 8}
